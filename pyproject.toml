[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "opendecision"
version = "0.2.0"
description = "An auditable typed decision layer for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenDecision contributors" }]
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
laya = ["laya"]
langgraph = ["langgraph>=0.2"]
fastapi = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
  "coverage[toml]>=7.6",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["opendecision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["opendecision"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["opendecision"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
